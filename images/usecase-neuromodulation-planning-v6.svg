<title id="title">Compare candidates inside the twin</title><desc id="description">A synthetic network state feeds three candidate counterfactual trajectories with uncertainty envelopes. A dashed personal reference region allows comparison. The diagram represents investigator-reviewed modeling, not stimulation delivery, treatment selection or a successful intervention.</desc>
