<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
<title id="title">Sleep as a sequence of states</title><desc id="description">An original hypnogram-style synthetic eight-hour timeline uses four clearly labeled lanes: Awake, REM, Core and Deep. Colored rounded blocks mark stages and fine vertical lines show transitions. This is an illustrative sequence, not a sleep record or sleep-staging result.</desc>
<defs>
 <radialGradient id="back" cx="70%" cy="40%" r="90%"><stop stop-color="#132332"/><stop offset="1" stop-color="#070e17"/></radialGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bca4ff" stop-opacity=".2"/><stop offset="1" stop-color="#bca4ff" stop-opacity="0"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1,1 L6,4 L1,7" fill="none" stroke="#bca4ff" stroke-width="1.3"/></marker>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0 H0 V40" fill="none" stroke="#9cbed2" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="750" fill="url(#back)"/><rect width="1200" height="750" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif">
